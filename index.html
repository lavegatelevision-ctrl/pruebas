<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Profuse Tablet App</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <p class="brand">Profuse Intranet</p>
          <h1>Modo Tablet</h1>
        </div>
        <div class="actions">
          <button id="reloadBtn" type="button">Recargar</button>
          <a href="https://www.profuse.es/intranet/panel/" target="_blank" rel="noreferrer">Abrir en pestaña</a>
        </div>
      </header>

      <section class="notice" id="notice">
        <p>
          Esta vista está optimizada para tablet (horizontal o vertical). Si la web bloquea el embebido,
          usa el botón <strong>"Abrir en pestaña"</strong>.
        </p>
      </section>

      <section class="viewport">
        <iframe
          id="panelFrame"
          src="https://www.profuse.es/intranet/panel/"
          title="Profuse Intranet Panel"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-read; clipboard-write"
        ></iframe>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
